name: Test Telegram

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Testar envio para Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token:
              print("ERRO: TELEGRAM_BOT_TOKEN não está disponível.")
              sys.exit(1)

          if not chat_id:
              print("ERRO: TELEGRAM_CHAT_ID não está disponível.")
              sys.exit(1)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = json.dumps(
              {
                  "chat_id": chat_id,
                  "text": (
                      "✅ Teste GitHub Actions — Monitor de Milhas\n\n"
                      "Integração com Telegram funcionando corretamente."
                  ),
              }
          ).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  data = json.loads(response.read().decode("utf-8"))

          except urllib.error.HTTPError as exc:
              print(f"ERRO: Telegram respondeu HTTP {exc.code}.")
              sys.exit(1)

          except urllib.error.URLError:
              print("ERRO: falha de rede ao acessar o Telegram.")
              sys.exit(1)

          if not data.get("ok"):
              print("ERRO: Telegram retornou ok=false.")
              sys.exit(1)

          print("Mensagem Telegram enviada com sucesso.")
          PY
